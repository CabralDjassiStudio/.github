<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Cabral Djassi Studio</title>
  <desc id="desc">Atlantic-inspired visual connecting Cape Verdean island forms with product, software, design, automation and global network motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111b"/>
      <stop offset="0.55" stop-color="#0a1b29"/>
      <stop offset="1" stop-color="#0d2638"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a9fd6" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#4fc3e8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2a9fd6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5df9a"/>
      <stop offset="1" stop-color="#d9ad48"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1280" cy="120" r="260" fill="#248fc2" opacity="0.08" filter="url(#soft)"/>
  <circle cx="385" cy="410" r="190" fill="#e7bd5d" opacity="0.05" filter="url(#soft)"/>

  <!-- Atlantic contour lines -->
  <g fill="none" stroke="url(#sea)" stroke-width="2">
    <path d="M-40 365 C180 285 320 430 545 355 S905 270 1110 345 S1445 430 1660 335"/>
    <path d="M-20 400 C210 330 360 470 585 395 S920 310 1145 390 S1460 470 1650 380" opacity="0.65"/>
    <path d="M-60 318 C170 235 330 372 560 300 S900 220 1135 300 S1450 390 1665 285" opacity="0.45"/>
  </g>

  <!-- Brand mark / language-neutral copy -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="92" y="142" fill="#f6f8fa" font-size="25" font-weight="700" letter-spacing="5">CABRAL DJASSI STUDIO</text>
    <text x="92" y="260" fill="#f6f8fa" font-size="104" font-weight="780" letter-spacing="-4">CV → WORLD</text>
    <path d="M96 299 H560" stroke="#4fc3e8" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <circle cx="96" cy="299" r="7" fill="#e5bd5d"/>
    <circle cx="560" cy="299" r="7" fill="#ef5b5b"/>
  </g>

  <!-- Cape Verde / ten-island constellation -->
  <g transform="translate(665 82)">
    <path d="M50 82 C135 20 255 4 356 45 C452 84 514 159 545 244" fill="none" stroke="#4fc3e8" stroke-width="2" stroke-dasharray="7 10" opacity="0.42"/>
    <path d="M80 268 C210 318 335 303 468 231" fill="none" stroke="#4fc3e8" stroke-width="2" stroke-dasharray="7 10" opacity="0.3"/>
    <g fill="url(#gold)" stroke="#fff5ce" stroke-width="1.5">
      <circle cx="78" cy="92" r="9"/>
      <circle cx="132" cy="60" r="7"/>
      <circle cx="188" cy="84" r="8"/>
      <circle cx="232" cy="50" r="6"/>
      <circle cx="282" cy="104" r="9"/>
      <circle cx="315" cy="160" r="7"/>
      <circle cx="258" cy="194" r="8"/>
      <circle cx="202" cy="176" r="6"/>
      <circle cx="154" cy="222" r="9"/>
      <circle cx="104" cy="190" r="7"/>
    </g>
    <g fill="#4fc3e8" opacity="0.34">
      <circle cx="78" cy="92" r="19"/>
      <circle cx="282" cy="104" r="20"/>
      <circle cx="154" cy="222" r="19"/>
    </g>
  </g>

  <!-- Global product system -->
  <g transform="translate(1088 78)">
    <circle cx="205" cy="170" r="150" fill="none" stroke="#4fc3e8" stroke-width="1.6" opacity="0.27"/>
    <ellipse cx="205" cy="170" rx="150" ry="58" fill="none" stroke="#4fc3e8" stroke-width="1.3" opacity="0.22"/>
    <ellipse cx="205" cy="170" rx="72" ry="150" fill="none" stroke="#4fc3e8" stroke-width="1.3" opacity="0.22"/>
    <path d="M55 170 H355 M205 20 V320" stroke="#4fc3e8" stroke-width="1.2" opacity="0.16"/>

    <!-- Product -->
    <g transform="translate(34 78)">
      <rect width="132" height="78" rx="14" fill="#102c3f" stroke="#2c718e"/>
      <circle cx="26" cy="24" r="7" fill="#e5bd5d"/>
      <rect x="18" y="45" width="78" height="7" rx="3.5" fill="#eaf2f6" opacity="0.85"/>
      <rect x="18" y="58" width="48" height="5" rx="2.5" fill="#4fc3e8" opacity="0.75"/>
    </g>

    <!-- Software / code -->
    <g transform="translate(246 58)">
      <rect width="128" height="82" rx="14" fill="#102c3f" stroke="#2c718e"/>
      <path d="M32 24 18 40l14 16M82 24l14 16-14 16M65 20 49 61" fill="none" stroke="#4fc3e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Automation -->
    <g transform="translate(246 210)">
      <rect width="128" height="82" rx="14" fill="#102c3f" stroke="#2c718e"/>
      <circle cx="35" cy="41" r="14" fill="none" stroke="#e5bd5d" stroke-width="3"/>
      <circle cx="91" cy="41" r="10" fill="none" stroke="#4fc3e8" stroke-width="3"/>
      <path d="M51 41 H78" stroke="#ef5b5b" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Design -->
    <g transform="translate(30 224)">
      <rect width="138" height="82" rx="14" fill="#102c3f" stroke="#2c718e"/>
      <rect x="18" y="17" width="40" height="30" rx="6" fill="none" stroke="#4fc3e8" stroke-width="2"/>
      <circle cx="84" cy="31" r="10" fill="#e5bd5d"/>
      <path d="M18 60 H108" stroke="#eaf2f6" stroke-width="5" stroke-linecap="round" opacity="0.78"/>
    </g>

    <g stroke="#ef5b5b" stroke-width="2.2" fill="none" opacity="0.85">
      <path d="M165 118 C194 110 218 112 246 102"/>
      <path d="M285 140 C276 166 274 190 289 210"/>
      <path d="M246 258 C220 264 194 265 168 260"/>
      <path d="M96 224 C92 198 92 176 99 156"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7f9aaa">
    <text x="94" y="456">10 ●  /  ATLANTIC  /  DIGITAL  /  GLOBAL</text>
    <text x="1348" y="456" text-anchor="end">cabraldjassi.com</text>
  </g>

  <rect x="0.75" y="0.75" width="1598.5" height="518.5" rx="27.25" fill="none" stroke="#274559" stroke-width="1.5"/>
</svg>
